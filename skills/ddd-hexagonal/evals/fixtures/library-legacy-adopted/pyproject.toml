[project]
name = "library"
version = "0.3.2"
description = "Lending desk for the town library"
requires-python = ">=3.12"
dependencies = ["flask>=3.0", "psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/library"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "library"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward (target layout)"
type = "layers"
layers = ["(library.adapters)", "(library.application)", "(library.domain)"]

# Existing modules that hold the rules today (no layering yet, see docs/technical-spec.md).
# Adopt baseline: known violations go in ignore_imports; the list only shrinks.
[[tool.importlinter.contracts]]
name = "Rule modules use no web framework"
type = "forbidden"
source_modules = ["library.loans", "library.members", "library.catalog", "library.fees"]
forbidden_modules = ["flask"]
ignore_imports = []
