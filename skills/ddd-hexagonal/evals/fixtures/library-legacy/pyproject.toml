[project]
name = "library"
version = "0.3.2"
description = "Lending desk for the town library"
requires-python = ">=3.12"
dependencies = ["flask>=3.0", "psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
