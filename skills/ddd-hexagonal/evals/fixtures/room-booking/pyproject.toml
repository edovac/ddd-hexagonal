[project]
name = "roombooking"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "import-linter>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roombooking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.importlinter]
root_package = "roombooking"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
layers = ["roombooking.adapters", "roombooking.application", "roombooking.domain"]

[[tool.importlinter.contracts]]
name = "Core uses no driver"
type = "forbidden"
source_modules = ["roombooking.domain", "roombooking.application"]
forbidden_modules = ["psycopg"]

[tool.ruff]
line-length = 120
extend-exclude = ["tools", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
